name: CI

on: [push, pull_request]

jobs:
  test:

    runs-on: ubuntu-latest
    # ruby-head is informational: it can lag on prerelease-version quirks, so
    # let it report without blocking the required checks.
    continue-on-error: ${{ matrix.ruby == 'ruby-head' }}

    strategy:
      fail-fast: false
      matrix:
        # Ruby >= 3.0 to match the gem's required_ruby_version (Faraday 2's floor);
        # 3.2+ is what a Rails 8 host requires. Ruby < 3.0 can no longer resolve
        # faraday 2 / oauth2 2 and has been dropped.
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4", ruby-head]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # 'bundle install' and cache gems
        ruby-version: ${{ matrix.ruby }}
    - name: Run tests
      run: bundle exec rake
